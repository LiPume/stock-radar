name: Offline Unit Tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and deterministic tests only (never call real market API)
        run: |
          python -m compileall -q scripts src tests
          python -m unittest discover -s tests -v
          python scripts/market_probe.py --provider demo --output /tmp/stock_radar_demo.json
