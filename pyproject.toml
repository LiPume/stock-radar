[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-radar"
version = "0.1.0"
description = "Private holdings monitor with daily RSI risk alerts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/LiPume/stock-radar"
Homepage = "https://lipume.github.io/stock-radar/"

[project.optional-dependencies]
probe = ["akshare==1.18.91", "pandas>=2.0,<4"]
server = [
    "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.8,<3",
    "sqlalchemy>=2.0,<2.1", "alembic>=1.13,<2", "httpx>=0.27,<0.29",
    "apscheduler>=3.10,<4", "argon2-cffi>=23.1,<26", "python-dotenv>=1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
